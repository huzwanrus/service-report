<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="color-scheme" content="light">
<title>JN Service Report</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--bg:#f6f7f9;--paper:#fff;
  --blue:#1d4ed8;--blue-soft:#e8efff;--green:#15803d;--green-soft:#dcfce7;--amber:#b45309;--amber-soft:#fef3c7;
  --red:#b91c1c;--radius:14px;--safe-b:env(safe-area-inset-bottom,0px)
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top img.brand{height:24px}
.ibtn{border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:22px;height:22px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap;border:0;cursor:pointer}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.off{background:#fee2e2;color:var(--red)}

main{max-width:760px;margin:0 auto;padding:14px 14px calc(110px + var(--safe-b))}

/* list */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;outline:none}
.search input:focus{border-color:var(--blue)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.banner{background:var(--amber-soft);color:#78350f;border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.banner a{font-weight:700;text-decoration:underline}
.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px}
.card:active{background:var(--soft)}
.card .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.no{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.02em}
.no.draft{color:var(--mut)}
.badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-draft{background:var(--soft);color:var(--mut)}
.b-pending{background:var(--amber-soft);color:var(--amber)}
.b-synced{background:var(--green-soft);color:var(--green)}
.card .cl{font-weight:600;margin-top:4px}
.card .eq{color:var(--ink);font-size:14px}
.card .mt{color:var(--mut);font-size:12.5px;margin-top:3px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:15;background:var(--blue);color:#fff;border:0;border-radius:99px;padding:15px 22px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(29,78,216,.35);display:flex;gap:8px;align-items:center;cursor:pointer}

/* form */
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.sec h2{margin:0 0 10px;font-size:12px;letter-spacing:.07em;color:var(--blue);font-weight:700}
.f{display:block;margin-bottom:11px}
.f:last-child{margin-bottom:0}
.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.f textarea{resize:vertical;min-height:46px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.noBox{display:flex;justify-content:space-between;align-items:center;background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.noBox small{color:var(--mut);display:block;font-size:12px}
.wt{display:flex;flex-wrap:wrap;gap:8px}
.wt label{position:relative}
.wt input{position:absolute;opacity:0;pointer-events:none}
.wt span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;background:#fff}
.wt input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.part{display:grid;grid-template-columns:22px 1fr 64px 36px;gap:6px;align-items:start;margin-bottom:7px}
.part .pn{color:var(--mut);font-size:13px;padding-top:11px;text-align:center}
.part textarea,.part input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;background:#fff;resize:none}
.part button{border:0;background:none;color:var(--red);font-size:22px;height:40px;cursor:pointer}
.add{border:1px dashed #94a3b8;background:none;border-radius:10px;padding:8px 12px;color:var(--mut);cursor:pointer;width:100%}
.sig{border:1.5px dashed #94a3b8;border-radius:12px;height:110px;display:grid;place-items:center;color:var(--mut);background:#fff;cursor:pointer;overflow:hidden;margin-bottom:8px}
.sig{position:relative}
.sigbtns{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.sbtn svg{width:17px;height:17px;color:var(--blue)}
.sbtn.d{color:var(--red);margin-left:auto}
.sbtn:active{background:var(--soft)}
.imgprev{border:1px solid var(--line);border-radius:12px;background:repeating-conic-gradient(#f1f5f9 0 25%,#fff 0 50%) 0 0/16px 16px;min-height:160px;max-height:50vh;display:grid;place-items:center;overflow:hidden}
.imgprev img{max-width:100%;max-height:50vh;display:block}
.tog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.tog input{width:20px;height:20px}
.sig img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:10px;justify-content:center}
.bar>div{display:flex;gap:10px;width:100%;max-width:760px}
.btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;font-weight:700;cursor:pointer;text-align:center}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.d{color:var(--red)}
.btn:disabled{opacity:.55}

/* view */
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.acts .btn{padding:12px 8px;font-size:14px}
.sigv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sigv div{border-top:2px solid var(--ink);padding-top:5px;font-size:12.5px;color:var(--mut)}
.sigv img{max-width:100%;height:70px;object-fit:contain;display:block}
.sigv b{color:var(--ink);display:block}
.meta{font-size:12.5px;color:var(--mut);text-align:center;margin:6px 0 16px}

/* modal signature */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:720px}
.mbox h3{margin:0 0 4px;font-size:16px}
.mbox p{margin:0 0 10px;color:var(--mut);font-size:13px}
#sigCanvas{width:100%;height:240px;border:1px solid var(--line);border-radius:12px;touch-action:none;background:#fff;display:block}
.mbtns{display:flex;gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--soft);padding:2px 5px;border-radius:5px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.kv{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<header class="top">
  <button class="ibtn" id="backBtn" hidden aria-label="Kembali">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img class="brand" id="brand" src="logo.jpg" alt="Biz Medic">
  <h1 id="title">Service Report</h1>
  <button class="pill" id="pill" title="Segerak sekarang">…</button>
  <button class="ibtn" id="setBtn" aria-label="Tetapan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="app"></main>

<div class="modal" id="sigModal">
  <div class="mbox">
    <h3 id="sigTitle">Tandatangan</h3>
    <p>Tandatangan dengan jari di dalam kotak. Pusingkan phone ke landskap untuk ruang lebih besar.</p>
    <canvas id="sigCanvas"></canvas>
    <div class="mbtns">
      <button class="btn" id="sigClear">Kosongkan</button>
      <button class="btn" id="sigCancel">Batal</button>
      <button class="btn p" id="sigSave">Simpan</button>
    </div>
  </div>
</div>
<div class="modal" id="imgModal">
  <div class="mbox">
    <h3 id="imgTitle">Gambar tandatangan</h3>
    <p>Semak hasilnya. Latar kertas dijadikan putih dan gambar dipotong mengikut tandatangan secara automatik.</p>
    <div class="imgprev"><img id="imgPrev" alt="Pratonton tandatangan"></div>
    <label class="tog"><input type="checkbox" id="imgClean" checked> Bersihkan latar &amp; potong automatik</label>
    <div class="mbtns">
      <button class="btn" id="imgRotate">Putar ↻</button>
      <button class="btn" id="imgCancel">Batal</button>
      <button class="btn p" id="imgSave">Guna gambar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
