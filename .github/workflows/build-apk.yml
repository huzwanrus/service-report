name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JN-Service-Report.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JN-Service-Report-APK
          path: JN-Service-Report.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JN Service Report (build ${{ github.run_number }})
          body: APK debug untuk dipasang terus di phone Android. Muat turun JN-Service-Report.apk di bawah.
          files: JN-Service-Report.apk
